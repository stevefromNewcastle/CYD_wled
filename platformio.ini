; PlatformIO project for the ESP32 CYD (Cheap Yellow Display / ESP32-2432S028R)
; Based on: https://randomnerdtutorials.com/programming-esp32-cyd-cheap-yellow-display-vs-code/
;
; Board field uses the generic "esp32dev" (Espressif ESP32 Dev Module) rather than a
; CYD-specific board ID, since that ID only exists in third-party platform forks.
; All CYD-specific wiring (display + touch pins, driver) comes from include/User_Setup.h,
; which is force-included ahead of TFT_eSPI's own config via the -include build flag below.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-1110
monitor_port = /dev/cu.usbserial-1110

build_flags =
    -Iinclude
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h
    ; Uncomment to flip the display (and touch mapping) 180 degrees:
    -DDISPLAY_ROTATION=180

lib_deps =
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bodmer/TFT_eSPI@^2.5.43
    lvgl@^9.2.0
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^6.21.3
